<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mentor Desk</title>
<meta name="description" content="A private planner. Data stays on your device.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mentor Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header + tab strip, one working column with a side rail on wide screens; floating quick-add button. */
/* Black & white UI; color is reserved for status (done / due / overdue) and task categories. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f3f3; --ink:#0a0a0a; --ink-2:#5f5f5f; --line:#e5e5e5;
  --accent:#0a0a0a; --accent-ink:#ffffff; --accent-soft:#f0f0f0;
  --warn:#b45309; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2; --good:#16a34a; --good-soft:#dcfce7;
  --c-msg:#16a34a; --c-class:#2563eb; --c-hw:#d97706; --c-table:#9333ea; --c-mentor:#0891b2; --c-extra:#ea580c; --c-admin:#64748b;
  --font-head:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgb(0 0 0/.05),0 4px 14px rgb(0 0 0/.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#111111; --surface-2:#1c1c1c; --ink:#f5f5f5; --ink-2:#a3a3a3; --line:#262626;
  --accent:#fafafa; --accent-ink:#0a0a0a; --accent-soft:#1f1f1f;
  --warn:#fbbf24; --warn-soft:#3a2a08; --bad:#f87171; --bad-soft:#3b1212; --good:#4ade80; --good-soft:#0f2e1a;
  --c-msg:#4ade80; --c-class:#60a5fa; --c-hw:#fbbf24; --c-table:#c084fc; --c-mentor:#22d3ee; --c-extra:#fb923c; --c-admin:#94a3b8;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 4px 14px rgb(0 0 0/.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#111111; --surface-2:#1c1c1c; --ink:#f5f5f5; --ink-2:#a3a3a3; --line:#262626;
  --accent:#fafafa; --accent-ink:#0a0a0a; --accent-soft:#1f1f1f;
  --warn:#fbbf24; --warn-soft:#3a2a08; --bad:#f87171; --bad-soft:#3b1212; --good:#4ade80; --good-soft:#0f2e1a;
  --c-msg:#4ade80; --c-class:#60a5fa; --c-hw:#fbbf24; --c-table:#c084fc; --c-mentor:#22d3ee; --c-extra:#fb923c; --c-admin:#94a3b8;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 4px 14px rgb(0 0 0/.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:12px 4px;min-width:0}
.brand{font-family:var(--font-head);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .mark{width:28px;height:28px;display:block;flex:none}
.sync{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap;min-width:0;overflow:hidden}
.sync span{overflow:hidden;text-overflow:ellipsis}
.sync i{flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:inline-block}
.sync[data-s="ok"] i{background:var(--good)} .sync[data-s="saving"] i{background:var(--warn)} .sync[data-s="error"] i{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 12px;border-bottom:2px solid transparent;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;font-size:14px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tabs a .n{font-family:var(--font-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:1px 6px;margin-left:4px}

main{padding-block:20px 120px}
h1,h2,h3{font-family:var(--font-head);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600;font-family:var(--font-ui)}
.sub{color:var(--ink-2);font-size:14px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.section{display:flex;flex-direction:column;gap:10px}
.section>header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--ink-2)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--ink-2);text-align:center;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn.icon{padding:6px;width:32px;height:32px;justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.wa{background:#16a34a;border-color:#16a34a;color:#fff}
.wa:hover{filter:brightness(1.07);background:#16a34a}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.cat-msg{--c:var(--c-msg)} .cat-class{--c:var(--c-class)} .cat-hw{--c:var(--c-hw)} .cat-table{--c:var(--c-table)} .cat-mentor{--c:var(--c-mentor)} .cat-extra{--c:var(--c-extra)} .cat-admin{--c:var(--c-admin)}
.chip.cat{color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.ok{background:var(--good-soft);color:var(--good)}

/* item rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:30px 54px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:none}
.item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.item .when{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);padding-top:5px;font-variant-numeric:tabular-nums}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.item .acts{display:flex;gap:4px;align-items:center}
.item.done .t{text-decoration:line-through;color:var(--ink-2)}
.item.done,.item.skip{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.item.skip .t{color:var(--ink-2);font-style:italic}
.item.overdue .when{color:var(--bad)}
.item.cls{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.item.cls .t{font-family:var(--font-head);font-weight:700}
.item.cls.cancelled .t{text-decoration:line-through}
.check{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;margin-top:1px;padding:0}
.check:hover{border-color:var(--accent)}
.check svg{width:15px;height:15px;opacity:0}
.done .check{background:var(--good);border-color:var(--good);color:#fff}
.done .check svg{opacity:1}
.skip .check{border-style:dashed}
.clsdot{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.clsdot svg{width:15px;height:15px}
@media (max-width:560px){
  .item{grid-template-columns:28px minmax(0,1fr) auto;gap:8px}
  .item .when{grid-column:2;grid-row:1;padding-top:0;font-size:12px}
  .item .body{grid-column:2;grid-row:2}
  .item .acts{grid-column:3;grid-row:1/3}
  .item .check,.item .clsdot{grid-row:1/3}
  .item .acts .hide-sm{display:none}
}

/* hero next-up */
.next{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.next::after{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c,var(--accent))}
.next .big{font-family:var(--font-head);font-size:21px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.next .count{font-family:var(--font-mono);font-size:13px;color:var(--c,var(--accent));font-weight:500}
@media (max-width:560px){.next{grid-template-columns:minmax(0,1fr)}}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner b{color:var(--warn)}
.banner .grow{flex:1 1 260px;min-width:0}
.banner.info{background:var(--surface-2);border-color:var(--line)}
.banner.info b{color:var(--ink)}

.progress{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);border-radius:5px}
.links a{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
.links a:first-child{border-top:none}
.links a span{color:var(--ink-2);font-size:12px}
.links .missing{color:var(--warn)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding:6px 8px;font-weight:600}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:none;text-align:left;align-items:stretch;min-width:0}
.cal .day:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.cal .day.out{background:var(--bg);color:var(--ink-2)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .num{font-family:var(--font-mono);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.cal .today .num b{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px}
.cal .ev{font-size:11.5px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}
.cal .ev.cls{background:var(--c);color:#fff;font-weight:600}
.cal .ev.done{opacity:.5;text-decoration:line-through}
.cal .more{font-size:11px;color:var(--ink-2)}
.cal .dots{display:none;gap:3px;flex-wrap:wrap}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cal .badge{font-size:10px;background:var(--bad);color:#fff;border-radius:8px;padding:0 5px}
@media (max-width:640px){.cal .day{min-height:58px;padding:4px}.cal .ev,.cal .more{display:none}.cal .dots{display:flex}.cal .dow{padding:5px 4px;font-size:10px;text-align:center}}

/* week glance */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.week .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.week .col h3{font-size:13px;display:flex;justify-content:space-between}
.week .w{font-size:12px;border-left:3px solid var(--c);padding:3px 6px;background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:0 5px 5px 0}
.week .w .tm{font-family:var(--font-mono);color:var(--ink-2);display:block;font-size:11px}
.week .w.cls{background:var(--c);color:#fff}
.week .w.cls .tm{color:#fff;opacity:.85}
.week .w.later{opacity:.55}
.scrollx{overflow-x:auto}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .pre{white-space:pre-wrap;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.clickable{cursor:pointer;text-align:left}
.card.clickable:hover{border-color:var(--accent)}

.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.rtable tr:first-child td{border-top:none}
.rtable .tm{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rtable tr.off td{opacity:.5}

.meter{display:flex;gap:4px}
.meter i{width:22px;height:8px;border-radius:3px;background:var(--surface-2)}
.meter i.on{background:var(--good)}
.meter i.paid{background:var(--c-extra)}

.lesson{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:14px}
.lesson:first-child{border-top:none}
.lesson.covered .lt{color:var(--ink-2)}
.lesson.nextup{background:var(--accent-soft)}

/* forms + dialog */
dialog{border:none;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgb(0 0 0/.3)}
dialog::backdrop{background:rgb(8 14 12/.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
.dlg>header{padding:16px 18px 8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dlg>.body{padding:6px 18px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dlg>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg>footer .left{margin-right:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500;min-width:0}
.f input,.f select,.f textarea,input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:15px;width:100%;min-width:0}
.f textarea,textarea.in{resize:vertical;min-height:90px;line-height:1.45}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cb{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.cb input{width:18px;height:18px;accent-color:var(--accent)}
.preview{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.preview mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px}
.poll{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.poll .o{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.qa-preview{font-size:13px;color:var(--ink-2);min-height:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:5px 10px;font-size:13px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:7;border:none;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 18px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgb(0 0 0/.22);cursor:pointer}
.fab svg{width:18px;height:18px}
.lockscr{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));transition:opacity .28s ease,transform .28s ease;user-select:none;-webkit-user-select:none}
.lockscr.out{opacity:0;transform:scale(1.04)}
.lk-top{display:flex;flex-direction:column;align-items:center;gap:14px}
.lk-title{font-family:var(--font-head);font-size:21px;font-weight:700;letter-spacing:-.01em}
.lk-dots{display:flex;gap:18px;height:22px;align-items:center}
.lk-dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);background:transparent;transition:background .14s,border-color .2s}
.lk-dots i.on{background:var(--ink)}
.lk-dots i.pop{animation:lk-pop .24s cubic-bezier(.3,1.6,.5,1)}
.lk-dots[data-state="bad"]{animation:lk-shake .42s}
.lk-dots[data-state="bad"] i{border-color:var(--bad);background:var(--bad)}
.lk-dots[data-state="ok"] i{border-color:var(--good);background:var(--good);animation:lk-pop .3s}
@keyframes lk-pop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes lk-shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-12px)}36%{transform:translateX(10px)}54%{transform:translateX(-7px)}72%{transform:translateX(4px)}}
.lk-msg{min-height:18px;font-size:13.5px;color:var(--bad);font-weight:500}
.lk-pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 28px}

async function pinKey(k){
  const rec=pinRec();if(!rec||pinBusy||Date.now()<pinWaitUntil||pinBuf.length>=8)return;
  pinBuf+=k;paintDots('add');buzz(6);
  if(rec.len){if(pinBuf.length===rec.len)setTimeout(tryUnlock,140);return}

  const rec=pinRec();if(!rec||pinBusy||Date.now()<pinWaitUntil)return;
  if(!pinBuf){const m=$('#pin-msg');if(m)m.textContent='Type your PIN';return}
  pinBusy=true;

    if(!rec.len){try{localStorage.setItem(PIN_KEY,JSON.stringify(Object.assign({},rec,{len:pinBuf.length})))}catch(e){}}

  setTimeout(()=>{pinBuf='';pinBusy=false;
    if(pinFails>=5){pinWaitUntil=Date.now()+30000;pinFails=0;render();const t=setInterval(()=>{if(!locked||Date.now()>=pinWaitUntil){clearInterval(t)}if(locked)render()},1000);return}

}

function pushItems(){

  const label=i=>i.src==='extra'?'Extra class now':i.src==='xatt'?'Fill the Extra Classes table':i.title;   /* no student names leave the device */

function strHash(x){let h=5381;for(let i=0;i<x.length;i++)h=(h*33+x.charCodeAt(i))|0;return String(h>>>0)}
async function syncPush(force,sub){
  const c=pushCfg();if(!S||!c||!c.on||!pushSupported())return false;
  try{
    const reg=await swReady();sub=sub||await reg.pushManager.getSubscription();
    if(!sub){c.on=false;localStorage.setItem(PUSH_KEY,JSON.stringify(c));return false}
    const items=pushItems(),h=strHash(sub.endpoint+JSON.stringify(items));
    if(!force&&h===c.hash&&Date.now()-(c.at||0)<6*3600e3)return true;
    const r=await fetch(PUSH_URL+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id,secret:c.secret,code:c.code||'',sub:sub.toJSON(),items})});
    if(r.status===401){c.on=false;delete c.code;localStorage.setItem(PUSH_KEY,JSON.stringify(c));pushLast='code';return false}
    if(r.ok){c.hash=h;c.at=Date.now();c.registered=true;delete c.code;localStorage.setItem(PUSH_KEY,JSON.stringify(c))}
    pushLast=r.ok?'ok':'fail';return r.ok;

}

async function enablePush(code){

  const e=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const enc=new TextEncoder();
  const fold=line=>{const out=[];let cur='',b=0;for(const ch of line){const n=enc.encode(ch).length;if(b+n>(out.length?74:75)){out.push(cur);cur='';b=0}cur+=ch;b+=n}out.push(cur);return out.join('\r\n ')};
  const BY=['MO','TU','WE','TH','FR','SA','SU'],evs=[];

  for(const cl of classes()){const f=items.find(i=>i.src==='class'&&i.classId===cl.id&&!i.cancelled);if(f)ev('class-'+cl.id,'🎓 '+cl.name,f.date,f.min,Math.max(15,f.end-f.min),'FREQ=WEEKLY;BYDAY='+BY[isoDow(f.date)-1]+';UNTIL='+until,'',false);}
  for(const r of routines()){

    ev(r.id,'🔔 '+r.title,f.date,f.min,15,rr,(r.notes||'')+(r.onlineOnly?'\n(Only when the class is online or hybrid.)':'')+(r.tpl?'\nMessage template ready in Mentor Desk.':''),true);

  return {text:['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mentor Desk//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Mentor','X-WR-TIMEZONE:'+TZ,...tz,...evs,'END:VCALENDAR'].join('\r\n')+'\r\n',count:evs.length};

/* ---------- schedule engine ---------- */
/* Course timing. Lesson N = the Nth main-class session counted from the start date (cancelled
   classes are skipped), so month 2 starts on the day of lesson 9, month 3 on lesson 17, and the
   course ends on the last lesson. Change the start date, cancel a class or move a class day and
   every month boundary, reminder and deadline re-syncs. Without a syllabus, months are calendar months. */
const LPM=8;
let LS_CACHE={key:'',list:[]};
const mainClasses=()=>classes().filter(c=>c.kind==='main'&&c.active&&c.day&&c.start);
function lessonSchedule(){
  const total=SYL.lessons.length,cs=cfg().courseStart,mains=mainClasses();
  const key=cs+'|'+total+'|'+JSON.stringify(mains)+'|'+JSON.stringify(L().overrides);
  if(LS_CACHE.key===key)return LS_CACHE.list;
  const out=[];
  if(total&&mains.length){
    const byDay={};mains.forEach(c=>(byDay[c.day]=byDay[c.day]||[]).push(c));
    Object.values(byDay).forEach(a=>a.sort((x,y)=>toMin(x.start)-toMin(y.start)));
    for(let d=cs,i=0;out.length<total&&i<900;i++,d=addDays(d,1)){
      for(const c of (byDay[isoDow(d)]||[])){
        if(out.length>=total)break;
        const ov=L().overrides[c.id+'@'+d]||{};if(ov.cancelled)continue;
        const mv=ov.moved&&ov.moved.date?ov.moved:null;
        out.push({n:out.length+1,date:mv?mv.date:d,origDate:d,classId:c.id,min:mv&&mv.start?toMin(mv.start):toMin(c.start)});
      }
    }
    out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.min-b.min);out.forEach((l,i)=>l.n=i+1);
  }
  LS_CACHE={key,list:out};return out;
}
const totalMonths=()=>SYL.lessons.length?Math.ceil(SYL.lessons.length/LPM):(+cfg().months||8);
function evenMonthStart(k){const cs=cfg().courseStart,ce=cfg().courseEnd;if(!ce)return addMonths(cs,k);return addDays(cs,Math.round(k*daysBetween(cs,ce)/totalMonths()))}
const phaseStart=p=>{const k=p==='month2'?1:p==='month3'?2:0;if(!k)return cfg().courseStart;const l=lessonSchedule()[k*LPM-1];return l?addDays(l.date,1):evenMonthStart(k)};
function courseEnd(){const c=cfg();if(c.courseEnd)return c.courseEnd;const ls=lessonSchedule();if(ls.length&&ls.length===SYL.lessons.length)return ls[ls.length-1].date;return addDays(addMonths(c.courseStart,+c.months||8),-1)}
const inPhase=(d,p)=>d>=phaseStart(p||'all')&&d<=courseEnd();
function isTaught(l){const t=todayYmd();return l.date<t||(l.date===t&&nowMin()>=l.min+60)}
const taughtCount=()=>lessonSchedule().filter(isTaught).length;
function courseMonth(d){
  const cs=cfg().courseStart;if(d<cs)return 0;
  const ls=lessonSchedule();
  if(ls.length){let m=1;for(let k=1;k<totalMonths();k++){const l=ls[k*LPM-1];if(l&&d>l.date)m=k+1;else break}return m}
  let m=1;while(m<totalMonths()&&d>=evenMonthStart(m))m++;return m;
}
function lessonAt(classId,date){const l=lessonSchedule().find(x=>x.classId===classId&&x.date===date);return l?l.n:null}
/* start date so that exactly n lessons have been taught before now */
function startForTaught(n){
  const mains=mainClasses();if(!mains.length)return null;
  const t=todayYmd(),past=[];
  for(let d=t,i=0;past.length<Math.max(n,1)&&i<500;i++,d=addDays(d,-1)){
    const day=mains.filter(c=>+c.day===isoDow(d)).sort((a,b)=>toMin(b.start)-toMin(a.start));
    for(const c of day){if((L().overrides[c.id+'@'+d]||{}).cancelled)continue;if(d===t&&nowMin()<toMin(c.start)+60)continue;past.push(d)}
  }
  if(n<=0){for(let d=t,i=0;i<30;i++,d=addDays(d,1))if(mains.some(c=>+c.day===isoDow(d)))return d;return t}
  return past[n-1]||past[past.length-1]||null;
}

function classSessions(from,to){
  const out=[];
  for(const c of classes()){
    if(!c.active||!c.day||!c.start)continue;
    const sm0=toMin(c.start),dur=Math.max(15,(toMin(c.end)??sm0+120)-sm0);
    for(let d=nextDow(addDays(from,-21),+c.day);d<=addDays(to,21);d=addDays(d,7)){
      if(!inPhase(d,c.phase))continue;
      const ov=L().overrides[c.id+'@'+d]||{};
      const mv=ov.moved&&ov.moved.date?ov.moved:null;
      const date=mv?mv.date:d,sm=mv&&mv.start?toMin(mv.start):sm0;
      if(date<from||date>to)continue;
      out.push({c,date,origDate:d,moved:!!mv,mode:ov.mode||c.mode,cancelled:!!ov.cancelled,startMin:sm,endMin:sm+dur});
    }
  }
  return out;
}
let ITEMS=new Map();
function itemsFor(from,to){
  const out=[],lg=L(),sessions=classSessions(addDays(from,-3),addDays(to,3)),track=cfg().trackFrom||'';
  for(const s of sessions){
    if(s.date<from||s.date>to)continue;
    out.push({key:'class:'+s.c.id+'@'+s.origDate,src:'class',date:s.date,min:s.startMin,end:s.endMin,title:s.c.name,cat:s.c.kind==='mentor'?'mentor':'class',classId:s.c.id,classDate:s.date,origDate:s.origDate,moved:s.moved,mode:s.mode,cancelled:s.cancelled,status:''});
  }
  const push=(r,date,min,extra)=>{
    if(track&&date<track)return;
    const key=r.id+'@'+(extra.origDate||extra.classDate||date);
    out.push(Object.assign({key,src:'routine',refId:r.id,date,min,title:r.title,cat:r.cat,tpl:r.tpl,link:r.link,notes:r.notes,status:lg.done[key]||''},extra));
  };
  for(const r of routines()){
    if(!r.active)continue;
    if(r.kind==='class'){
      for(const s of sessions){
        if(s.c.id!==r.classId||s.cancelled)continue;
        if(r.onlineOnly&&s.mode==='offline')continue;
        if(!inPhase(s.date,r.phase))continue;
        const base=(r.anchor==='end'?s.endMin:s.startMin)+(+r.offset||0);
        const shift=Math.floor(base/1440),min=base-shift*1440,date=addDays(s.date,shift);
        if(date<from||date>to)continue;
        push(r,date,min,{classId:s.c.id,classDate:s.date,origDate:s.origDate,sessMin:s.startMin});
      }
    }else if(r.kind==='weekly'){
      for(let d=nextDow(from,+r.day);d<=to;d=addDays(d,7))if(inPhase(d,r.phase))push(r,d,toMin(r.time),{});
    }else if(r.kind==='monthly'){
      for(let d=from;d<=to;d=addDays(d,1))if(parseYmd(d).getDate()===+r.dom&&inPhase(d,r.phase))push(r,d,toMin(r.time),{});
    }
  }
  for(const [id,t] of Object.entries(tasks())){
    if(t.date<from||t.date>to)continue;
    out.push({key:'task:'+id,src:'task',refId:id,date:t.date,min:toMin(t.time),title:t.title,cat:t.cat||'admin',tpl:t.tpl,link:t.link,notes:t.notes,status:t.done?'done':t.skip?'skip':''});
  }
  for(const [sid,st] of Object.entries(P().students)){
    for(const se of (st.sessions||[])){
      if(!se.date)continue;
      /* every extra class gets its own "log attendance" task ~15 min after it ends (60 min assumed) */
      if(se.status!=='cancelled'){
        let d2=se.date,m2=se.time?toMin(se.time)+75:null;if(m2!=null&&m2>=1440){d2=addDays(d2,1);m2-=1440}
        const k2='xatt:'+sid+':'+se.id;
        if(d2>=from&&d2<=to&&!(track&&d2<track))out.push({key:k2,src:'xatt',refId:se.id,sid,date:d2,min:m2,title:'Fill Extra Classes table · '+st.name,cat:'table',tpl:'',link:'extraTable',notes:(se.topic?se.topic+' · ':'')+'Log attendance for this extra class.',status:lg.done[k2]||''});
      }
      if(se.date<from||se.date>to)continue;
      out.push({key:'extra:'+sid+':'+se.id,src:'extra',refId:se.id,sid,date:se.date,min:toMin(se.time),title:'Extra class · '+st.name,cat:'extra',tpl:'extra-confirm',link:'extraTable',notes:se.topic||'',status:se.status==='held'?'done':se.status==='cancelled'?'skip':''});
    }
  }
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.min??1e4)-(b.min??1e4)||(a.src==='class'?-1:b.src==='class'?1:0));
  out.forEach(i=>ITEMS.set(i.key,i));
  return out;
}
function isPast(i){const t=todayYmd();return i.date<t||(i.date===t&&i.min!=null&&i.min<nowMin())}
const checkable=i=>i.src!=='class';
function overdueItems(){
  const t=todayYmd();
  return itemsFor(addDays(t,-7),t).filter(i=>checkable(i)&&!i.status&&isPast(i)&&i.date>=cfg().courseStart);
}
function routineWhen(r){
  if(r.kind==='weekly')return 'Every '+EN_DAYS[+r.day]+(r.time?' '+r.time:'');
  if(r.kind==='monthly')return 'Monthly, day '+r.dom+(r.time?' · '+r.time:'');
  const c=classById(r.classId);const name=c?c.name:'(deleted class)';
  const off=+r.offset||0;const rel=off===0?'At':hm(off)+(off<0?' before':' after');
  let s=rel+' '+name+' '+(r.anchor==='end'?'ends':'starts');
  const rep=routineSlot(r);if(rep)s+=' → '+EN_D[rep.dow]+' '+fromMin(rep.min);
  return s;
}
function routineSlot(r){
  if(r.kind==='weekly')return{dow:+r.day,min:toMin(r.time)??540};
  if(r.kind==='class'){
    const c=classById(r.classId);if(!c||!c.day||!c.start)return null;
    const base=toMin(r.anchor==='end'?(c.end||c.start):c.start)+(+r.offset||0);
    const shift=Math.floor(base/1440);
    return{dow:((+c.day-1+shift)%7+7)%7+1,min:base-shift*1440};
  }
  return null;
}
function nextLesson(){const l=lessonSchedule().find(x=>!isTaught(x));return l?l.n:null}
function lessonDate(n){const l=lessonSchedule()[n-1];return l?l.date:null}
function lessonTitle(n){const l=SYL.lessons.find(x=>x[0]===+n);return l?l[1]:''}
function recentLessons(k){return lessonSchedule().filter(isTaught).slice(-k).map(l=>l.n)}

/* ---------- google calendar ---------- */
function gcalUrl(title,details,date,min,dur,rrule){
  const st=(min==null?540:min),en=Math.min(st+(dur||15),1439);
  const f=m=>date.replace(/-/g,'')+'T'+fromMin(m).replace(':','')+'00';
  const p=new URLSearchParams({action:'TEMPLATE',text:title,dates:f(st)+'/'+f(en),details:details||'',ctz:TZ});
  if(rrule)p.set('recur',rrule);
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function gcalForRoutine(r){
  if(!r.active)return null;
  const t=todayYmd();
  const it=itemsFor(t,addDays(t,70)).find(i=>i.refId===r.id&&!(i.date===t&&isPast(i)));
  if(!it)return null;
  const until=courseEnd().replace(/-/g,'')+'T235959Z';
  const rr=r.kind==='monthly'?'RRULE:FREQ=MONTHLY;BYMONTHDAY='+r.dom+';UNTIL='+until:'RRULE:FREQ=WEEKLY;BYDAY='+['MO','TU','WE','TH','FR','SA','SU'][isoDow(it.date)-1]+';UNTIL='+until;
  return gcalUrl('🔔 '+r.title,(r.notes||'')+'\n\nOpen Mentor Desk to tick it off.',it.date,it.min,15,rr);
}

function studentStats(st){
  const free=+cfg().freeExtra||3;
  const held=(st.sessions||[]).filter(s=>s.status==='held').sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1)
    .map((se,i)=>({id:se.id,se,n:i+1,paid:i>=free}));
  return{held,free,planned:(st.sessions||[]).filter(s=>s.status==='planned')};
}
function unpaidNotes(){const out=[];for(const [sid,st] of Object.entries(P().students)){studentStats(st).held.forEach(h=>{if(h.paid&&!h.se.noted)out.push({sid,h})})}return out}

      <div class="sub">Snapshots double as backups. To start over, import your setup file.</div></section></div>`;

/* ---------- dialogs ---------- */
const dlg=$('#dlg');
function openDlg(title,body,footer,onMount){
  $('#dlg-body').innerHTML=`<form class="dlg" id="dlg-form" novalidate><header><h2>${title}</h2><button type="button" class="btn icon ghost" data-act="close" aria-label="Close">${ICON.x}</button></header><div class="body">${body}</div>${footer?`<footer>${footer}</footer>`:''}</form>`;
  if(!dlg.open){try{dlg.showModal()}catch(e){dlg.setAttribute('open','')}}
  const f=$('#dlg-form');f.onsubmit=e=>e.preventDefault();
  if(onMount)onMount(f);
  const first=f.querySelector('[autofocus]');if(first)setTimeout(()=>first.focus(),30);
}
function closeDlg(){if(dlg.open){try{dlg.close()}catch(e){dlg.removeAttribute('open')}}}
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg()});
function armDelete(btn,fn){if(btn.classList.contains('armed')){btn.classList.remove('armed');fn();return}const orig=btn.innerHTML;btn.classList.add('armed');btn.textContent='Tap again to confirm';setTimeout(()=>{if(btn.classList.contains('armed')){btn.classList.remove('armed');btn.innerHTML=orig}},3000)}

function parseQuick(s){
  const t=todayYmd();let date=null,time='',title=' '+s+' ';
  const tm=title.match(/\s(?:at\s)?(\d{1,2}):(\d{2})\s/i);
  if(tm&&+tm[1]<24&&+tm[2]<60){time=pad(+tm[1])+':'+tm[2];title=title.replace(tm[0],' ');}
  const rules=[[/\s(today|bu gün)\s/i,()=>t],[/\s(tomorrow|sabah)\s/i,()=>addDays(t,1)],
    [/\s(?:on\s)?(mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\s/i,m=>{const d=['mon','tue','wed','thu','fri','sat','sun'].indexOf(m[1].slice(0,3).toLowerCase())+1;return nextDow(addDays(t,1),d)}],
    [/\s(\d{1,2})[./](\d{1,2})\s/,m=>{const y=parseYmd(t).getFullYear();let d=y+'-'+pad(+m[2])+'-'+pad(+m[1]);if(d<t)d=(y+1)+'-'+pad(+m[2])+'-'+pad(+m[1]);return d}]];
  for(const [rx,fn] of rules){const m=title.match(rx);if(m){date=fn(m);title=title.replace(m[0],' ');break}}
  return{title:title.replace(/\s+/g,' ').trim(),date,time};
}

function buildCtx(item,giftId,tplId){
  const c=cfg(),t=todayYmd();
  const sendDate=item?item.date:t;
  let cl=item&&item.classId?classById(item.classId):null;
  let cd=item&&item.classDate?item.classDate:null;
  if(!cd){const up=itemsFor(t,addDays(t,7)).find(i=>i.src==='class'&&!i.cancelled&&classById(i.classId).kind==='main');if(up&&!item){cd=up.date;cl=classById(up.classId);}}
  if(item&&item.src==='extra'){cd=item.date;}
  const ctx={};
  const dateFor=cd||sendDate;
  ctx['tarix']=fmtAz(dateFor);ctx['gün']=AZ_DAYS[isoDow(dateFor)];
  ctx['saat']=item&&(item.src==='extra'||item.src==='class')&&item.min!=null?fromMin(item.min):item&&item.sessMin!=null?fromMin(item.sessMin):cl&&cl.start?cl.start:(item&&item.min!=null?fromMin(item.min):'');
  ctx['nə_vaxt']=dateFor===sendDate?'Bu gün':dateFor===addDays(sendDate,1)?'Sabah':AZ_DAYS[isoDow(dateFor)];
  ctx['link']=c.links.meeting||'';ctx['classroom']=c.links.classroom||'';ctx['youtube']=c.links.youtube||'';
  const dl=nextDow(sendDate,4);ctx['son_tarix']=fmtAz(dl)+' ('+AZ_DAYS[4]+')';
  const rl=recentLessons(4);
  const planned=Object.values(P().topics).filter(x=>x.status==='planned').map(x=>x.text);
  const lastTwo=rl.slice(-2).map(n=>lessonTitle(n));
  const mentorish=tplId==='mentor-remind'||(cl&&cl.kind==='mentor');
  ctx['mövzu']=mentorish&&planned.length?planned.join(', '):lastTwo.join('; ');
  rl.forEach((n,i)=>ctx['mövzu_'+(i+1)]=lessonTitle(n));
  ctx['koordinator']=c.coordinator||'';ctx['müəllim']=c.instructor||'';
  if(item&&item.origDate&&item.origDate!==item.classDate){const od=item.origDate;ctx['köhnə_tarix']=fmtAz(od)+' ('+AZ_DAYS[isoDow(od)]+')';}
  if(item&&item.src==='extra'){const st=P().students[item.sid];const se=st&&(st.sessions||[]).find(x=>x.id===item.refId);ctx['ad']=st?st.name:'';ctx['mövzu']=se&&se.topic||'';const s=st?studentStats(st):null;const h=s&&s.held.find(x=>x.id===item.refId);ctx['say']=h?String(h.n):s?String(s.held.length+1):'';}
  if(giftId){const g=P().gifts[giftId];if(g){ctx['tapşırıq']=g.idea;ctx['mükafat']=g.reward||'';if(g.deadline)ctx['son_tarix']=fmtAz(g.deadline)+' ('+AZ_DAYS[isoDow(g.deadline)]+')';}}
  if(item&&item.tpl==='recording')ctx['tarix']=fmtAz(item.classDate||item.date);
  return ctx;
}
function tokensOf(s){const out=[];String(s||'').replace(/\{([^{}\n]{1,40})\}/g,(_,k)=>{if(!out.includes(k))out.push(k)});return out}
function fill(s,v){return String(s||'').replace(/\{([^{}\n]{1,40})\}/g,(m,k)=>v[k]!=null&&v[k]!==''?v[k]:m)}
async function copyText(text,btn){
  try{await navigator.clipboard.writeText(text);if(btn){const o=btn.innerHTML;btn.innerHTML=ICON.check+'Copied';setTimeout(()=>btn.innerHTML=o,1400)}toast('Copied. Paste it in WhatsApp.');}
  catch(e){const ta=$('#cmp-out');if(ta){ta.hidden=false;ta.value=text;ta.focus();ta.select();}toast('Copy blocked here. The text is selected, press Ctrl+C / long-press to copy.');}
}

  let item=key?ITEMS.get(key):null;
  if(!item&&key&&key.startsWith('extra:')){const [,sid,seid]=key.split(':');const st=P().students[sid];const se=st&&(st.sessions||[]).find(x=>x.id===seid);
    if(se)item={key,src:'extra',refId:seid,sid,date:se.date,min:toMin(se.time),title:'Extra class · '+st.name,cat:'extra',notes:se.topic||'',status:se.status==='held'?'done':''};}
  const ctx=buildCtx(item,giftId,tplId);
  const toks=tokensOf(t.text+' '+(t.poll?t.poll.q+' '+t.poll.opts.join(' '):''));
  const vals={};toks.forEach(k=>vals[k]=ctx[k]||'');
  const needsVideo=toks.includes('video_link');
  const fields=toks.map(k=>`<label class="f">{${esc(k)}}<input data-tok="${esc(k)}" value="${esc(vals[k])}" ${k==='video_link'?'placeholder="Paste the YouTube link" autofocus':''}></label>`).join('');
  const body=`${item?`<div class="sub">For: ${esc(item.title)} · ${esc(fmtEn(item.date))}</div>`:''}
    ${toks.length?`<details ${toks.some(k=>!vals[k])?'open':''}><summary class="sub" style="cursor:pointer">Fields (${toks.filter(k=>vals[k]).length}/${toks.length} filled)</summary><div class="frow" style="margin-top:8px">${fields}</div></details>`:''}
    <div class="preview" id="cmp-prev"></div>
    <textarea class="in" id="cmp-out" hidden readonly rows="5" aria-label="Message text"></textarea>
    ${t.poll?`<div class="poll"><div class="eyebrow">Poll · create it in WhatsApp: 📎 → Poll${t.poll.multi?' · allow multiple answers':''}</div><div class="row" style="justify-content:space-between"><b id="cmp-pq"></b><button type="button" class="btn sm" data-act="copy-poll" data-i="q">${ICON.copy}</button></div><div id="cmp-po"></div></div>`:''}
    ${needsVideo&&safeUrl(cfg().links.studio)?`<div class="sub">Upload first: <a href="${esc(safeUrl(cfg().links.studio))}" target="_blank" rel="noopener">YouTube Studio ↗</a></div>`:''}`;
  const doneBtn=item&&checkable(item)&&item.status!=='done'?`<button type="button" class="btn left" data-act="toggle" data-key="${esc(key)}" data-close="1">${ICON.check}Mark task done</button>`:'';
  openDlg(esc(t.title),body,`${doneBtn}<button type="button" class="btn" data-act="edit-tpl" data-id="${esc(t.id)}">Edit template</button><button type="button" class="btn" id="cmp-copy">${ICON.copy}Copy</button><a class="btn wa" id="cmp-wa" target="_blank" rel="noopener">${ICON.msg}Open WhatsApp</a>`,f=>{
    const upd=()=>{
      f.querySelectorAll('[data-tok]').forEach(i=>vals[i.dataset.tok]=i.value.trim());
      const txt=fill(t.text,vals);
      $('#cmp-prev').innerHTML=esc(txt).replace(/\{([^{}\n]{1,40})\}/g,'<mark>{$1}</mark>');
      $('#cmp-wa').href='https://wa.me/?text='+encodeURIComponent(txt);
      f._txt=txt;
      if(t.poll){$('#cmp-pq').textContent=fill(t.poll.q,vals);f._poll=[fill(t.poll.q,vals)].concat(t.poll.opts.map(o=>fill(o,vals)));
        $('#cmp-po').innerHTML=t.poll.opts.map((o,i)=>`<div class="o"><span>${esc(fill(o,vals))}</span><button type="button" class="btn sm ghost" data-act="copy-poll" data-i="${i+1}" aria-label="Copy option">${ICON.copy}</button></div>`).join('');}
    };
    f.addEventListener('input',e=>{if(e.target.dataset.tok!=null)upd()});upd();
    $('#cmp-copy').onclick=e=>copyText(f._txt,e.currentTarget);
    f.addEventListener('click',e=>{const b=e.target.closest('[data-act="copy-poll"]');if(b){e.stopPropagation();const i=b.dataset.i==='q'?0:+b.dataset.i;copyText(f._poll[i],null)}},true);
  });
}

/* ---------- people dialogs ---------- */
function studentForm(id){
  const isNew=!id;const st=isNew?{name:'',sessions:[]}:P().students[id];
  openDlg(isNew?'Add student':'Edit student',`<label class="f">Name<input name="name" value="${esc(st.name)}" autofocus></label>`,
    `${!isNew?'<button type="button" class="btn danger left" data-act="del-student">Delete</button>':''}<button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button>`,f=>{
    f.onsubmit=e=>{e.preventDefault();const n=val(f,'name');if(!n){toast('Add a name');return}
      const nid=id||uid('s');P().students[nid]=Object.assign({},st,{name:n,sessions:st.sessions||[]});commit('people');
      if(isNew){closeDlg();sessionForm(nid)}else closeDlg();};
    const del=f.querySelector('[data-act="del-student"]');if(del)del.onclick=()=>armDelete(del,()=>{delete P().students[id];commit('people');closeDlg()});
  });
}
function sessionForm(sid,id){
  const st=P().students[sid];if(!st)return;const isNew=!id;
  const se=isNew?{id:uid('x'),date:todayYmd(),time:'',topic:'',status:'planned'}:clone(st.sessions.find(x=>x.id===id));
  const s=studentStats(st);const willBe=s.held.length+1;
  openDlg((isNew?'Session with ':'Edit session · ')+esc(st.name),`${isNew?`<div class="sub">${willBe>s.free?`<span class="chip bad">This will be extra class #${willBe}: paid, report it to the coordinator.</span>`:`Free extra class ${willBe} of ${s.free}.`}</div>`:''}
    <div class="frow"><label class="f">Date<input type="date" name="date" value="${esc(se.date)}"></label><label class="f">Time<input type="time" name="time" value="${esc(se.time)}"></label><label class="f">Status<select name="status">${optList({planned:'Planned',held:'Held',cancelled:'Cancelled'},se.status)}</select></label></div>
    <label class="f">Topic<input name="topic" value="${esc(se.topic)}" placeholder="e.g. Pandas groupby" autofocus></label>`,
    `${!isNew?'<button type="button" class="btn danger left" data-act="del-session">Delete</button>':''}<button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button>`,f=>{
    f.onsubmit=e=>{e.preventDefault();Object.assign(se,{date:val(f,'date')||todayYmd(),time:val(f,'time'),topic:val(f,'topic'),status:val(f,'status')});
      if(isNew)st.sessions.push(se);else st.sessions[st.sessions.findIndex(x=>x.id===id)]=se;commit('people');closeDlg();
      const s2=studentStats(st);const h=s2.held.find(x=>x.id===se.id);if(h&&h.paid&&!se.noted)toast(st.name+': extra class #'+h.n+' is paid. Report it to the coordinator.');else toast('Session saved, it is in your calendar');};
    const del=f.querySelector('[data-act="del-session"]');if(del)del.onclick=()=>armDelete(del,()=>{st.sessions=st.sessions.filter(x=>x.id!==id);commit('people');closeDlg()});
  });
}
function topicForm(id,preset){
  const isNew=!id;const tp=isNew?{text:preset||'',votes:1,status:'open',added:todayYmd()}:P().topics[id];
  openDlg(isNew?'Add struggle topic':'Edit topic',`<label class="f">Topic<input name="text" value="${esc(tp.text)}" autofocus></label><div class="frow"><label class="f">Votes / students<input type="number" min="0" name="votes" value="${esc(tp.votes||0)}"></label><label class="f">Status<select name="status">${optList({open:'Open',planned:'Planned for mentor hour',covered:'Covered'},tp.status)}</select></label></div>`,
    `${!isNew?'<button type="button" class="btn danger left" data-act="del-topic">Delete</button>':''}<button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button>`,f=>{
    f.onsubmit=e=>{e.preventDefault();if(!val(f,'text')){toast('Add the topic');return}P().topics[id||uid('tp')]=Object.assign({},tp,{text:val(f,'text'),votes:+val(f,'votes')||0,status:val(f,'status')});commit('people');closeDlg();toast('Topic saved');};
    const del=f.querySelector('[data-act="del-topic"]');if(del)del.onclick=()=>armDelete(del,()=>{delete P().topics[id];commit('people');closeDlg()});
  });
}
function giftForm(id){
  const isNew=!id;const g=isNew?{idea:'',reward:'',deadline:'',status:'idea',created:todayYmd()}:P().gifts[id];
  openDlg(isNew?'New gift-task idea':'Edit gift task',`<label class="f">Task<textarea name="idea" rows="3" style="min-height:70px" autofocus>${esc(g.idea)}</textarea></label><div class="frow"><label class="f">Reward<input name="reward" value="${esc(g.reward)}"></label><label class="f">Deadline<input type="date" name="deadline" value="${esc(g.deadline)}"></label><label class="f">Status<select name="status">${optList({idea:'Idea',asked:'Asked coordinator',approved:'Approved',announced:'Announced',done:'Finished'},g.status)}</select></label></div>`,
    `${!isNew?'<button type="button" class="btn danger left" data-act="del-gift">Delete</button>':''}<button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button>`,f=>{
    f.onsubmit=e=>{e.preventDefault();if(!val(f,'idea')){toast('Describe the task');return}P().gifts[id||uid('g')]=Object.assign({},g,{idea:val(f,'idea'),reward:val(f,'reward'),deadline:val(f,'deadline'),status:val(f,'status')});commit('people');closeDlg();};
    const del=f.querySelector('[data-act="del-gift"]');if(del)del.onclick=()=>armDelete(del,()=>{delete P().gifts[id];commit('people');closeDlg()});
  });
}

/* ---------- events ---------- */
let toastT;
function toast(msg){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3200)}
const ACT={
  'close':()=>closeDlg(),
  'load-recommended':()=>loadRecommended(),
  'quick':d=>{if(!S)return;taskForm(d.date?{date:d.date}:null)},
  'toggle':d=>{const i=ITEMS.get(d.key);const cur=i?i.status:(L().done[d.key]||'');setStatus(d.key,cur==='done'?'':'done');if(d.close)closeDlg();if(cur!=='done')toast('Done ✓')},
  'skip':d=>{const i=ITEMS.get(d.key);setStatus(d.key,i&&i.status==='skip'?'':'skip');closeDlg()},
  'item':d=>itemDialog(d.key),
  'compose':d=>composer(d.tpl,d.key,d.gift),
  'edit-task':d=>{closeDlg();taskForm(clone(tasks()[d.id]),d.id)},
  'edit-routine':d=>{closeDlg();routineForm(d.id)},
  'new-routine':()=>routineForm(),
  'edit-class':d=>{closeDlg();classForm(d.id)},
  'new-class':()=>classForm(),
  'edit-tpl':d=>{closeDlg();tplForm(d.id)},
  'new-student':()=>studentForm(),
  'edit-student':d=>studentForm(d.id),
  'edit-session':d=>{closeDlg();sessionForm(d.sid,d.id)},
  'noted':d=>{const se=P().students[d.sid].sessions.find(x=>x.id===d.id);se.noted=true;commit('people');toast('Marked as reported')},
  'edit-topic':d=>topicForm(d.id),
  'topic-from-lesson':d=>topicForm(null,'Gün '+d.n+': '+lessonTitle(d.n)),
  'vote':d=>{const tp=P().topics[d.id];tp.votes=(tp.votes||0)+1;commit('people')},
  'topic-status':d=>{P().topics[d.id].status=d.s;commit('people')},
  'edit-gift':d=>giftForm(d.id),
  'gift-next':d=>{const GS=['idea','asked','approved','announced','done'];const g=P().gifts[d.id];g.status=GS[Math.min(GS.indexOf(g.status)+1,4)];commit('people')},
  'cal-nav':d=>{CAL.month=addMonths(CAL.month,+d.n);render()},
  'cal-today':()=>{CAL.month=todayYmd().slice(0,7)+'-01';CAL.sel=todayYmd();render()},
  'cal-sel':d=>{CAL.sel=d.d;if(d.d.slice(0,7)!==CAL.month.slice(0,7))CAL.month=d.d.slice(0,7)+'-01';render()},
  'cls-mode':d=>{const o=L().overrides[d.k]=L().overrides[d.k]||{};const cid=d.k.split('@')[0];if(classById(cid).mode===d.m)delete o.mode;else o.mode=d.m;if(!Object.keys(o).length)delete L().overrides[d.k];commit('log');closeDlg();toast('Format set to '+MODES[d.m])},
  'cls-move':d=>{const f=$('#dlg-form');const nd=f.elements.cdate.value,nt=f.elements.ctime.value;if(!nd||!nt){toast('Pick a date and time');return}
    const [cid,od]=d.k.split('@');const cl=classById(cid);const o=L().overrides[d.k]=L().overrides[d.k]||{};
    if(nd===od&&nt===cl.start)delete o.moved;else o.moved={date:nd,start:nt};if(!Object.keys(o).length)delete L().overrides[d.k];
    commit();closeDlg();toast('Moved to '+fmtEn(nd)+' '+nt+'. Its tasks moved too.')},
  'cls-unmove':d=>{const o=L().overrides[d.k]||{};delete o.moved;if(!Object.keys(o).length)delete L().overrides[d.k];commit();closeDlg();toast('Back to the original time')},
  'more':()=>openDlg('More',`<div class="tiles">${MORE_VIEWS.map(([id,lab,sub,ic])=>`<a class="tile" href="#${id}" data-act="close" ${VIEW===id?'aria-current="page"':''}>${ICON[ic]}<b>${lab}</b><span>${sub}</span></a>`).join('')}</div>`,''),
  'erase-data':(d,b)=>armDelete(b,()=>{try{localStorage.removeItem(LS_KEY)}catch(e){}S=null;store.empty=true;location.hash='#today';render();toast('Everything erased on this device')}),
  'fresh-start':()=>{cfg().trackFrom=todayYmd();commit();toast('Overdue cleared. Tracking starts today.')},
  'cls-cancel':d=>{const o=L().overrides[d.k]=L().overrides[d.k]||{};o.cancelled=!o.cancelled;if(!o.cancelled)delete o.cancelled;if(!Object.keys(o).length)delete L().overrides[d.k];commit('log');closeDlg();toast(o.cancelled?'Class cancelled. Its reminders are hidden.':'Class restored')},
  'confirm-taught':()=>{const n=Math.max(0,+($('#bn-taught')||{}).value||0);const st=startForTaught(n);if(st)cfg().courseStart=st;cfg().startConfirmed=true;commit();toast(n+' lessons covered · month '+courseMonth(todayYmd())+', next lesson Gün '+(nextLesson()||'–'))},
  'end-auto':()=>{delete cfg().courseEnd;commit();toast('End date follows the last lesson again')},
  'confirm-start':()=>{const v=$('#bn-start').value;if(v)cfg().courseStart=v;cfg().startConfirmed=true;commit('settings');toast('Course start saved')},
  'move':d=>{const i=ITEMS.get(d.key);const f=$('#dlg-form');const nd=f.elements.mdate.value,nt=f.elements.mtime.value;if(!nd)return;
    if(i.src==='task'){const t=tasks()[i.refId];t.date=nd;t.time=nt;commit('tasks');}
    else{tasks()[uid('t')]={title:i.title,date:nd,time:nt,cat:i.cat,notes:(i.notes?i.notes+' ':'')+'(moved from '+fmtEn(i.date)+')',tpl:i.tpl||'',link:i.link||'',done:false};L().done[d.key]='skip';commit('tasks','log');}
    closeDlg();toast('Moved to '+fmtEn(nd))},
  'backup':()=>{if(downloadFile(snapName(),backupJson(),'application/json')){cfg().lastBackup=todayYmd();saveLocal();render();toast('Snapshot exported')}},
  'share-backup':async()=>{
    try{await navigator.share({files:[new File([backupJson()],snapName(),{type:'application/json'})],title:'Mentor Desk snapshot'});cfg().lastBackup=todayYmd();saveLocal();render();toast('Snapshot sent')}
    catch(e){if(e&&e.name!=='AbortError')toast('Sharing failed. Use Export snapshot instead.')}},
  'ics':()=>{const r=buildIcs();if(!r.count){toast('No reminders to export yet');return}if(downloadFile('mentor-reminders.ics',r.text,'text/calendar'))toast(r.count+' repeating reminders exported')},
  'unlock':()=>tryUnlock(),
  'pin-key':d=>pinKey(d.k),
  'pin-del':()=>pinDel(),
  'forgot-pin':()=>{const f=$('#forgot');if(f)f.hidden=!f.hidden},
  'erase-all':(d,b)=>armDelete(b,()=>{try{localStorage.removeItem(LS_KEY);localStorage.removeItem(PIN_KEY)}catch(e){}location.reload()}),
  'lock-now':()=>lockNow(),
  'remove-pin':(d,b)=>armDelete(b,()=>{try{localStorage.removeItem(PIN_KEY)}catch(e){}render();toast('PIN removed')}),
  'set-pin':async()=>{const a=($('#pin-new')||{}).value||'',b=($('#pin-new2')||{}).value||'';
    if(!/^\d{4,8}$/.test(a)){toast('Use 4 to 8 digits');return}if(a!==b){toast('The two PINs don’t match');return}
    const salt=Math.random().toString(36).slice(2,12);
    try{localStorage.setItem(PIN_KEY,JSON.stringify({salt,len:a.length,hash:await hashPin(a,salt)}));render();toast('PIN set. Write it down somewhere safe.')}catch(e){toast('Couldn’t save the PIN on this device')}},
  'install':async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;renderInstall();},
  'notif':async()=>{try{const p=await Notification.requestPermission();toast(p==='granted'?'Alerts on':'Alerts not allowed');}catch(e){toast('This browser can’t show alerts')}render()},
  'push-on':()=>{const c=pushCfg();if(c&&c.registered){enablePush();return}
    openDlg('Push code',`<div class="sub">Enter your private push code. It keeps copies of this app off your notification server. Only needed once per device. It is in <b>push-code.txt</b> on your computer.</div><input id="push-code" class="in mono" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" style="text-transform:uppercase;letter-spacing:.15em;font-size:20px;text-align:center">`,
      `<button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" data-act="push-code-ok">Continue</button>`,()=>setTimeout(()=>{const i=$('#push-code');if(i)i.focus()},50))},
  'push-code-ok':()=>{const v=(($('#push-code')||{}).value||'').trim().toUpperCase();if(v.length<6){toast('Enter the push code');return}closeDlg();enablePush(v)},
  'push-off':()=>disablePush(),
  'push-test':()=>testPush(),
  'push-sync':async()=>{const ok=await syncPush(true);render();toast(ok?'Schedule sent':'Couldn’t reach the notification server')},
  'notif-test':()=>{const o={body:'Alerts work. You will get one at each task time while the app is open or recently used.',icon:'icon-192.png',tag:'test'};try{if(swReg&&swReg.showNotification)swReg.showNotification('Mentor Desk',o);else new Notification('Mentor Desk',o)}catch(e){toast('Couldn’t show the alert')}},
  'reset-plan':(d,b)=>armDelete(b,()=>{S.plan=clone(DEF.plan);S.templates=clone(DEF.templates);S.settings.classes=clone(DEF.settings.classes);commit('plan','templates','settings');toast('Routines and templates reset')})
};
function onClick(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const fn=ACT[b.dataset.act];if(!fn)return;
  if(b.tagName==='A'&&b.dataset.act==='close'){closeDlg();return}
  e.preventDefault();fn(b.dataset,b,e);
}
function onChange(e){
  const el=e.target,k=el.dataset.change;if(!k)return;
  if(k==='restore'){restoreFrom(el);return}
  if(k==='reset-load'){const file=el.files&&el.files[0];if(!file)return;const rd=new FileReader();
    rd.onload=()=>{let o;try{o=JSON.parse(rd.result);if(!o||!o.plan||!o.settings)throw 0}catch(err){toast('That file is not a Mentor Desk setup file');return}
      openDlg('Clean this device?',`<div>Everything on this device is erased and replaced with <b>${esc(file.name)}</b>.</div><div class="sub">Tip: export a snapshot first if you might want today's data back.</div>`,
        `<button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn danger" id="do-reset">Erase &amp; load</button>`,
        ()=>{$('#do-reset').onclick=()=>{S=normalize(o);migrate();store.empty=false;saveLocal();syncIdle();schedulePushSync();closeDlg();location.hash='#today';render();toast('Clean start. Setup file loaded.')}});};
    rd.readAsText(file);el.value='';return}
  if(!S)return;
  if(k==='cfg'){let v=el.value;if(el.type==='number')v=Math.max(+el.min||0,+v||0);cfg()[el.dataset.k]=v;if(el.dataset.k==='courseStart')cfg().startConfirmed=true;commit('settings');toast('Saved')}
  else if(k==='link'){const v=el.value.trim();if(v&&!safeUrl(v)){toast('Links must start with https://');return}cfg().links[el.dataset.k]=v;commit('settings');toast('Link saved')}
  else if(k==='routine-active'){const r=routines().find(x=>x.id===el.dataset.id);r.active=el.checked;commit('plan')}
  else if(k==='taught'){const n=Math.max(0,+el.value||0);const st=startForTaught(n);if(st){cfg().courseStart=st;cfg().startConfirmed=true;commit();toast('Synced: start '+fmtEn(st)+', month '+courseMonth(todayYmd()))}}
  else if(k==='course-end'){if(el.value&&el.value<=cfg().courseStart){toast('End date must be after the start date');render();return}if(el.value)cfg().courseEnd=el.value;else delete cfg().courseEnd;commit();toast('End date saved')}
}
function restoreFrom(el){
  const file=el.files&&el.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{let o;try{o=JSON.parse(rd.result);if(!o||!o.plan||!o.settings)throw 0}catch(err){toast('That file is not a Mentor Desk setup or backup file');return}
    const theirs=(o.settings&&o.settings.settings&&o.settings.settings.updatedAt)||o.exported||'';
    const apply=()=>{S=normalize(o);migrate();store.empty=false;saveLocal();syncIdle();schedulePushSync();closeDlg();render();toast('Snapshot imported. This device is up to date.')};
    if(!S){apply();return}
    const mine=cfg().updatedAt||'',older=!!(mine&&theirs&&theirs<mine);
    openDlg(older?'This snapshot is older':'Import this snapshot?',`<div>Snapshot: <b>${theirs?esc(fmtStamp(theirs)):'unknown time'}</b><br>This device: <b>${mine?esc(fmtStamp(mine)):'unknown time'}</b></div><div class="sub">${older?'Importing it would undo the newer changes on this device.':'It replaces everything on this device.'}</div>`,`<button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn ${older?'danger':'primary'}" id="do-restore">${older?'Import anyway':'Import'}</button>`,()=>{$('#do-restore').onclick=apply});};
  rd.readAsText(file);el.value='';
}
boot();
})();
</script>
